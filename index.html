<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T24 Turnos</title>
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="T24 Turnos">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#141414;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f3ee}
  #carga{position:fixed;inset:0;display:grid;place-items:center;background:#141414;transition:opacity .3s}
  #carga img{width:120px;height:120px;border-radius:24px}
</style>
</head>
<body>
<div id="carga"><img src="icon-192.png" alt="T24"></div>
<!-- La app real sigue siendo la de Google Apps Script; esta página solo le da ícono y nombre en el celular. -->
<iframe src="https://script.google.com/macros/s/AKfycbxv0gTarlXjgnppni_rv528K-3goAZZVeT-1Q4SHlfjX7jXb8bcpO7TgbeZPma6MYjn/exec" allow="camera; geolocation; clipboard-write" title="T24 Turnos"
  onload="var c=document.getElementById('carga');c.style.opacity=0;setTimeout(function(){c.remove()},350)"></iframe>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
